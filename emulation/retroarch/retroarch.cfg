libretro_directory = "~/.config/retroarch/cores"
libretro_info_path = "/usr/share/libretro/info"
core_info_cache_enable = "false"
system_directory = "/mnt/omv/Games/BIOS"
video_driver = "vulkan"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_monitor_index = "1"
# Shaders on; only systems with a preset (es-de-setup.py: 2D home systems) get one
video_shader_enable = "true"
menu_driver = "ozone"
input_joypad_driver = "sdl2"
input_autodetect_enable = "true"
input_menu_toggle_gamepad_combo = "4"
quit_press_twice = "false"
savestate_auto_save = "true"
savestate_auto_load = "true"
savestate_thumbnail_enable = "true"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
sort_savefiles_by_content_enable = "false"
sort_savestates_by_content_enable = "false"
config_save_on_exit = "false"
# Hotkeys as on Batocera: hold Home (guide, SDL button 5) plus
#   Start exit · A menu · B reset · X save state · Y load state
#   d-pad up/down state slot · right fast forward · LB screenshot
input_enable_hotkey_btn = "5"
input_exit_emulator_btn = "6"
input_menu_toggle_btn = "0"
input_reset_btn = "1"
input_save_state_btn = "2"
input_load_state_btn = "3"
input_state_slot_increase_btn = "11"
input_state_slot_decrease_btn = "12"
input_toggle_fast_forward_btn = "14"
input_screenshot_btn = "9"
# Close Content quits RetroArch when ES-DE started it (command line), back to ES-DE
quit_on_close_content = "2"
# Logs go to logs/retroarch.log only with verbose logging on; level 1 = info
log_to_file = "true"
log_verbosity = "true"
frontend_log_level = "1"
libretro_log_level = "1"
log_to_file_timestamp = "false"
